<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*{box-sizing:border-box}[hidden]{display:none!important}:root{color-scheme:light}body{margin:0}</style>
<title>Grammar&amp;vocabulary hunters</title>
<meta name="theme-color" content="#1B2559">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#FFFFFF; --sheet:#FFFFFF; --ink:#111B3D; --ink2:#5A6684; --line:#E4E8F1; --field:#F7F8FC;
  --brand:#4338CA; --brand2:#6D5EF6; --brand-soft:#ECEBFF; --on-brand:#FFFFFF;
  --hero1:#1B2559; --hero2:#3B2FB8;
  --red:#D6293E; --red-soft:#FDECEF; --green:#12805C; --green-soft:#E3F6EE;
  --mark:#E6B422; --mark-soft:#FFF7DB;
  --shadow:0 1px 2px rgba(17,27,61,.04),0 4px 16px -8px rgba(17,27,61,.10);
  --r:16px;
  --f-display:'Plus Jakarta Sans',Inter,system-ui,sans-serif;
  --f-body:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-en:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{color-scheme:light;direction:ltr;-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding-block:0 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:820px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
.en{font-family:var(--f-en);direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#prog{direction:ltr;unicode-bidi:isolate}

/* header */
.bar{
  margin-top:max(14px,env(safe-area-inset-top,0px));margin-bottom:22px;
  background:#fff;color:var(--ink);border:1px solid var(--line);
  border-radius:20px;padding:18px 22px;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  position:relative;
}
.bar::after{content:"";position:absolute;inset-block:0;inset-inline-end:0;width:240px;border-radius:inherit;background:radial-gradient(circle at 100% 0,rgba(67,56,202,.08),transparent 70%);pointer-events:none}
.brand{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}
.brand b{font-family:var(--f-display);font-size:1.6rem;font-weight:800;letter-spacing:.2px;line-height:1.2}
.brand span{font-family:var(--f-en);font-size:.78rem;color:var(--ink2);direction:ltr;text-align:start;letter-spacing:.3px}
.brand span[dir]{font-size:.82rem;color:var(--ink2)!important;margin-top:4px!important}
.bar{flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:16px}
.bar .brand{order:2;min-width:0}
.menu-btn{order:1;position:relative;z-index:3;width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;flex:none;transition:background .15s,border-color .15s}
.menu-btn:hover{background:var(--field)}
.menu-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.menu-btn i{display:block;width:22px;height:2px;border-radius:2px;background:var(--ink);transition:transform .2s,opacity .2s}
.menu-btn[aria-expanded="true"] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.menu-btn[aria-expanded="true"] i:nth-child(2){opacity:0}
.menu-btn[aria-expanded="true"] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.tabs{position:absolute;z-index:5;inset-inline-start:14px;top:calc(100% - 8px);min-width:210px;display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 18px 40px -12px rgba(17,27,61,.28)}
.tabs[hidden]{display:none}
.tab{border:0;background:transparent;padding:13px 16px;min-height:46px;border-radius:11px;cursor:pointer;font-weight:600;font-size:1.02rem;color:var(--ink);text-align:start;transition:background .15s,color .15s}
.tab+.tab{border-top:1px solid var(--line);border-top-left-radius:0;border-top-right-radius:0}
.tab:hover{background:var(--field)}
.tab[aria-selected="true"]{color:var(--brand);background:var(--brand-soft)}
.tab:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.btn:focus-visible,.opt:focus-within,input:focus-visible,select:focus-visible,textarea:focus-visible,.subtab:focus-visible,tr.clk:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}

/* sheet / cards */
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:26px 26px 28px;box-shadow:var(--shadow);margin-bottom:18px}
.sheet h2{font-size:1.5rem;margin-bottom:6px}
.lead{color:var(--ink2);margin-bottom:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}.sheet{padding:20px 16px 22px}}
label.f{display:flex;flex-direction:column;gap:7px;font-size:.93rem;font-weight:600}
.in{width:100%;background:var(--field);border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;min-height:46px;min-width:0;transition:border-color .15s,box-shadow .15s,background .15s}
.in:hover{border-color:var(--ink2)}
.in:focus{border-color:var(--brand);background:var(--sheet);box-shadow:0 0 0 4px var(--brand-soft);outline:none}
textarea.in{min-height:120px;resize:vertical;line-height:1.7}
.hint{font-size:.82rem;color:var(--ink2);font-weight:400}
.btn{border:1.5px solid transparent;background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--on-brand);color:#fff;
  padding:11px 24px;min-height:44px;border-radius:12px;cursor:pointer;font-weight:700;
  box-shadow:0 6px 16px -6px rgba(67,56,202,.6);transition:transform .15s,box-shadow .15s,opacity .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px -8px rgba(67,56,202,.7)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{border-color:var(--brand);color:var(--brand);transform:none}
.btn.red{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 6px 16px -6px rgba(214,41,62,.55)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.86rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{background:var(--mark-soft);border:1px solid var(--mark);border-radius:12px;padding:11px 16px;font-size:.92rem}
.note.bad{background:var(--red-soft);border-color:var(--red)}
.note.ok{background:var(--green-soft);border-color:var(--green)}
.facts{display:flex;gap:8px 20px;flex-wrap:wrap;margin:14px 0 20px;font-size:.92rem;color:var(--ink2)}
.facts b{color:var(--ink);font-family:var(--f-mono);font-weight:600}

/* exam */
.exbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:15;background:color-mix(in srgb,var(--sheet) 88%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);border-radius:14px;padding:11px 18px;margin-bottom:18px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap}
.meter{flex:1 1 140px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:99px;width:0;transition:width .3s ease}
.part{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 0 14px;
  background:var(--brand-soft);border-radius:12px;padding:10px 16px}
.part h3{font-size:1.15rem;color:var(--brand)}
.part .en{font-size:.85rem;color:var(--ink2);font-weight:500}
.q{padding:18px 0;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.qhead{display:flex;gap:12px;align-items:flex-start}
.qn{font-family:var(--f-mono);font-size:.82rem;font-weight:600;color:var(--brand);background:var(--brand-soft);
  min-width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;margin-top:1px}
.qt{font-size:1.1rem;font-weight:600;flex:1;min-width:0;overflow-wrap:anywhere;padding-top:2px}
.qt.en{text-align:left}
.qhint{font-size:.85rem;color:var(--ink2);margin-top:2px;font-weight:400}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;margin-inline-start:42px}
@media (max-width:560px){.opts{grid-template-columns:1fr;margin-inline-start:0}}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt span{display:flex;align-items:center;min-height:48px;padding:10px 16px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);
  overflow-wrap:anywhere;font-weight:500;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.opt:hover span{border-color:var(--brand2);background:var(--field)}
.opt input:checked + span{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);font-weight:700;box-shadow:0 0 0 3px var(--brand-soft)}
.opt input:focus-visible + span{outline:3px solid var(--brand2);outline-offset:2px}
.opt .en,.opt span.en{text-align:left}
.opt.right span{background:var(--green-soft);border-color:var(--green);color:var(--green);box-shadow:none}
.opt.wrong span{background:var(--red-soft);border-color:var(--red);color:var(--red);box-shadow:none;text-decoration:line-through;text-decoration-color:var(--red)}
.tip{margin-top:12px;margin-inline-start:42px;font-size:.9rem;color:var(--ink2);background:var(--field);border-radius:10px;border-inline-start:3px solid var(--brand);padding:8px 12px}
@media (max-width:560px){.tip{margin-inline-start:0}}

/* one question per screen */
.qtitle{font-size:1.2rem;color:var(--ink2);font-weight:700}
.qstep{font-size:.9rem;color:var(--ink2);margin:6px 0 4px}
.qstep b{color:var(--brand)}
#qcard .q{border-bottom:0;padding:10px 0 4px}
#qcard .qt{font-size:1.3rem;line-height:1.6}
#qcard .opt span{min-height:56px;font-size:1.05rem}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.navrow .btn{min-width:130px}
.dots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:6px 4px 0}
.dot{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink2);font-family:var(--f-mono);font-weight:600;cursor:pointer;transition:all .15s}
.dot:hover{border-color:var(--brand)}
.dot.done{background:var(--brand-soft);border-color:var(--brand2);color:var(--brand)}
.dot.cur{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px -4px rgba(67,56,202,.6)}
.dot:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.qimg{display:block;max-width:100%;max-height:360px;margin:14px 0 0;margin-inline-start:42px;border-radius:14px;border:1px solid var(--line);background:var(--field);object-fit:contain}
@media (max-width:560px){.qimg{margin-inline-start:0}.navrow .btn{min-width:0;flex:1}}
.imgprev{border:1px dashed var(--line);border-radius:12px;padding:8px;background:var(--field);display:inline-block;max-width:100%}
.imgprev img{display:block;max-width:100%;max-height:200px;border-radius:8px}
/* result */
.res{display:flex;gap:26px;align-items:center;flex-wrap:wrap}
.score{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;flex:none;text-align:center;
  background:radial-gradient(closest-side,var(--sheet) 72%,transparent 74%),conic-gradient(from 0deg,var(--brand),var(--brand2),var(--green),var(--brand));
  box-shadow:0 10px 30px -10px rgba(67,56,202,.5)}
.score b{display:block;font-family:var(--f-mono);font-size:2.1rem;line-height:1.05;color:var(--brand);font-weight:700;direction:ltr}
.score small{display:block;font-family:var(--f-mono);font-size:.8rem;color:var(--ink2);direction:ltr}
.split{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.pill{border:1px solid var(--line);border-radius:999px;padding:4px 16px;font-size:.9rem;background:var(--field)}
.pill b{font-family:var(--f-mono);font-weight:600}
.mark{display:inline-block;font-weight:800;margin-inline-end:6px}
.mark.y{color:var(--green)} .mark.n{color:var(--red)}
.rv{padding:14px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:0}

/* teacher */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media (max-width:620px){.stats{grid-template-columns:1fr 1fr}}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:4px;background:linear-gradient(var(--brand),var(--brand2))}
.stat b{display:block;font-family:var(--f-mono);font-size:1.7rem;font-weight:700;line-height:1.25;direction:ltr;text-align:left;color:var(--brand)}
.stat span{font-size:.84rem;color:var(--ink2);font-weight:500}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.subtab{border:1.5px solid var(--line);background:var(--sheet);border-radius:999px;padding:7px 18px;min-height:40px;cursor:pointer;font-weight:600;color:var(--ink2);transition:all .15s}
.subtab:hover{border-color:var(--brand);color:var(--brand)}
.subtab[aria-selected="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.scroller{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.92rem}
th,td{padding:11px 14px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--field);font-weight:700;font-size:.8rem;color:var(--ink2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}
tr.clk:hover td{background:var(--brand-soft)}
td.num{font-family:var(--f-mono);direction:ltr;text-align:left;white-space:nowrap}
.pct{font-family:var(--f-mono);font-weight:700}
.pct.hi{color:var(--green)} .pct.lo{color:var(--red)}
.bars{display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:minmax(110px,170px) 1fr 52px;gap:12px;align-items:center;font-size:.9rem}
@media (max-width:520px){.brow{grid-template-columns:1fr 52px}.brow .track{grid-column:1/-1;order:3}}
.track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--green);border-radius:99px}
.track i.w{background:var(--red)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px}
@media (max-width:560px){.checks{grid-template-columns:1fr}}
.chk{display:flex;gap:10px;align-items:center;font-size:.93rem;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--brand)}
.wl{display:flex;flex-direction:column}
.wi{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
@media (max-width:560px){.wi{grid-template-columns:1fr auto}.wi .ar{grid-column:1;}}
.empty{text-align:center;padding:36px 14px;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.15rem;margin-bottom:4px}
.erow{display:flex;gap:8px;align-items:center}
.erow input[type=radio]{width:20px;height:20px;accent-color:var(--green);flex:none}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;margin-inline-start:42px}
@media (max-width:560px){.acts{margin-inline-start:0}}
.sp{height:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.btn:hover{transform:none}}
</style>
</head><body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><b>Grammar&amp;vocabulary hunters</b><span dir="ltr" style="display:block;margin-top:2px;font-weight:600">Ms.Eman Almogheiry</span></div>
    <button class="menu-btn" id="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><i></i><i></i><i></i></button>
    <nav class="tabs" id="menu" role="tablist" aria-label="Pages" hidden>
      <button class="tab" role="tab" id="tab-exam" aria-selected="true" data-go="exam">Home</button>
      <button class="tab" role="tab" id="tab-about" aria-selected="false" data-go="about">About</button>
      <button class="tab" role="tab" id="tab-teacher" aria-selected="false" data-go="teacher">Teacher panel</button>
    </nav>
  </header>
  <main id="main"></main>
</div>

<script>
document.documentElement.setAttribute('dir','ltr');document.documentElement.setAttribute('lang','en');
/* ============ DATA ============ */
// word|arabic|level|sentence with ___|pos
const BANK_RAW = `

/* ============ EXAM ENGINE ============ */
function makeRng(seed){
  let a=seed>>>0;
  const r=()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};
  const R={r,
    int:n=>Math.floor(r()*n),
    pick:arr=>arr[Math.floor(r()*arr.length)],
    shuffle:arr=>{const x=arr.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;},
    sample:(arr,n)=>R.shuffle(arr).slice(0,n)
  };
  return R;
}
function mcq(R,q,correct,wrongs,extra){
  const seen=new Set([String(correct).toLowerCase()]);const w=[];
  for(const x of R.shuffle(wrongs)){const k=String(x).toLowerCase();if(!seen.has(k)){seen.add(k);w.push(x);}if(w.length===3)break;}
  if(w.length<3)return null;
  const o=R.shuffle([correct,...w]);
  return Object.assign({q,o,a:o.indexOf(correct),qd:'ltr',od:'ltr'},extra||{});
}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const AUX_OTHER=aux=>['am','is','are'].filter(x=>x!==aux);
const HAS_OTHER=aux=>aux==='has'?'have':'has';

    return mcq(R,q,b,['am','is','are','be']);},
  art(R){const [n,a]=R.pick(ARTICLES);const q=R.pick(ART_FRAMES).replace('#',n);
    return mcq(R,q,a,['a','an','some','much']);},
  plu(R){const [s,p,w1,w2]=R.pick(PLURALS);
    return mcq(R,`One ${s}, two ___.`,p,[w1,w2,s,s+'en']);},
  prep(R){const x=R.pick(PREPS);return mcq(R,x[0],x[1],x.slice(2));},

    return mcq(R,x[6],x[2],[x[1],x[4],x[0]]);},

/* ---- vocabulary generators ---- */
function mutate(R,w){
  const out=new Set();
  const ops=[
    s=>{if(s.length<4)return s;const i=1+R.int(s.length-3);return s.slice(0,i)+s[i+1]+s[i]+s.slice(i+2);},
    s=>{if(s.length<4)return s;const i=1+R.int(s.length-2);return s.slice(0,i)+s.slice(i+1);},
    s=>{const i=1+R.int(s.length-1);return s.slice(0,i)+s[i]+s.slice(i);},
    s=>{const vs=[...s].map((c,i)=>'aeiou'.includes(c)?i:-1).filter(i=>i>0);if(!vs.length)return s;const i=R.pick(vs);const c=R.pick('aeiou'.split('').filter(x=>x!==s[i]));return s.slice(0,i)+c+s.slice(i+1);}
  ];
  let t=0;while(out.size<3&&t<60){t++;const m=R.pick(ops)(w);if(m!==w&&m.trim()===m)out.add(m);}
  return [...out];
}
function vocabQ(R,w,type,all){
  const others=all.filter(x=>x.e!==w.e);
  if(type==='en2ar'){
    const ws=R.sample(others,14).map(x=>x.a);
    return mcq(R,`What does “${w.e}” mean?`,w.a,ws,{qd:'ltr',od:'ltr',type});
  }
  if(type==='ar2en'){
    const same=others.filter(x=>w.pos&&x.pos===w.pos);
    const src=same.length>=3?same:others;
    return mcq(R,`Choose the word that means: “${w.a}”`,w.e,R.sample(src,14).map(x=>x.e),{qd:'ltr',od:'ltr',type});
  }
  if(type==='gap'&&w.s&&w.s.includes('___')){
    const same=others.filter(x=>w.pos&&x.pos===w.pos);
    const src=same.length>=3?same:others;
    return mcq(R,w.s,w.e,R.sample(src,14).map(x=>x.e),{qd:'ltr',od:'ltr',type});
  }
  if(type==='spell'&&w.e.length>=4&&/^[a-z' -]+$/i.test(w.e)){
    const m=mutate(R,w.e);if(m.length<3)return null;
    return mcq(R,`Choose the correct spelling of the word that means: “${w.a}”`,w.e,m,{qd:'ltr',od:'ltr',type});
  }
  return null;
}

  if(pool.length<4)pool=[...BANK.filter(inLv),...cw];
  const questions=[];
  const op=ownPicks(cfg,own);const useOwn=op.pool&&op.pool.length>0;
  const onlyOwn=useOwn&&cfg.ownMode==='only';
  // vocabulary
  const vn=onlyOwn?0:Math.max(0,Math.min(cfg.vocabCount,pool.length));
  const words=R.sample(pool,vn);
  const types=[];while(types.length<vn)types.push(...R.shuffle(['en2ar','ar2en','gap','spell']));
  words.forEach((w,i)=>{
    let q=vocabQ(R,w,types[i],all)||vocabQ(R,w,'en2ar',all)||vocabQ(R,w,'ar2en',all);
    if(q){q.sec='v';q.topic='vocab';q.tip='';q.w=w.e;questions.push(q);}
  });
  // grammar
  const ok=TOPICS.filter(t=>cfg.topics.includes(t.id)&&(lv===0||t.lv.includes(lv)));
  const avail=ok.length?ok:TOPICS.filter(t=>lv===0||t.lv.includes(lv));
  const seen=new Set();let guard=0;const order=[];
  const gn=onlyOwn?0:cfg.grammarCount;
  while(order.length<gn&&guard<400){
    guard++;
    if(!order.length||order.length%avail.length===0)var round=R.shuffle(avail);
    const t=round[order.length%avail.length];
    const q=GEN[t.id](R);
    if(!q||seen.has(q.q))continue;
    seen.add(q.q);q.sec='g';q.topic=t.id;q.tip=t.tip;q.type='grammar';order.push(q);
  }
  questions.push(...order);
  if(useOwn){R.sample(op.pool,op.n).forEach(x=>questions.push(ownQ(R,x)));}
  const vs=R.shuffle(questions.filter(q=>q.sec==='v')),gs=R.shuffle(questions.filter(q=>q.sec==='g'));
  questions.length=0;questions.push(...vs,...gs);
  return {seed,code:seed.toString(36).toUpperCase().slice(-5),title:cfg.title,level:lv,timeMin:cfg.timeMin,showAnswers:cfg.showAnswers,questions};
}
const hasAr=s=>/[؀-ۿ]/.test(s);
function genQuestion(cfg,custom,sec,topic,avoid){
  cfg=Object.assign({},DEFAULT_CFG,cfg||{});
  const R=makeRng((Math.random()*4294967295)>>>0);
  const cw=(custom||[]).map(x=>({e:x.e,a:x.a,s:x.s||'',l:x.l||2,pos:'',b:0}));
  const all=[...BANK,...cw];const lv=cfg.level;
  const inLv=w=>lv===0||(lv===1?w.l<=1:(w.l<=lv&&w.l>=lv-1));
  let pool=cfg.vocabSource==='custom'?cw:cfg.vocabSource==='both'?[...BANK.filter(inLv),...cw]:BANK.filter(inLv);
  if(pool.length<4)pool=[...BANK.filter(inLv),...cw];
  for(let k=0;k<60;k++){
    let q=null;
    if(sec==='g'){
      const ok=TOPICS.filter(t=>topic?t.id===topic:(lv===0||t.lv.includes(lv)));
      const t=R.pick(ok.length?ok:TOPICS);q=GEN[t.id](R);
      if(q){q.sec='g';q.topic=t.id;q.tip=t.tip;q.type='grammar';}
    }else{
      const w=R.pick(pool);
      q=vocabQ(R,w,R.pick(['en2ar','ar2en','gap','spell']),all)||vocabQ(R,w,'en2ar',all);
      if(q){q.sec='v';q.topic='vocab';q.tip='';}
    }
    if(q&&!avoid.has(q.q))return q;
  }
  return null;
}

async function cx(kind,path,args,ms){
  const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),ms||12000);
  try{
    const r=await fetch(CX+'/api/'+kind,{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json'},

    let j=null;try{j=await r.json();}catch(e){}

}

function submit(auto){

    const t=tp[q.topic]||(tp[q.topic]=[0,0]);t[1]++;if(ok)t[0]++;
    items.push([q.sec,q.topic,q.q,q.o[q.a],S.ans[i]>=0?q.o[S.ans[i]]:'']);
  });
  const c=cv+cg,n=nv+ng;
  S.sum={id:newId(),t:Date.now(),code:E.code,v:[cv,nv],g:[cg,ng],c,n,pct:n?Math.round(100*c/n):0,
    dur:Math.round((Date.now()-S.startAt)/1000),title:E.title,lv:E.level,tp,items,auto:!!auto,round:S.cfg.compOn?S.cfg.compRound:0,min:S.cfg.compOn?S.cfg.compMin[S.cfg.compRound-1]:0};

function copyText(text,out){
  const done=ok=>{out.hidden=false;out.textContent=ok?'Copied.':'Could not copy automatically. Select this text and copy it: '+text;};
  try{navigator.clipboard.writeText(text).then(()=>done(true),()=>done(false));}catch(e){done(false);}
}

/* ---- grades ---- */
function tGrades(){
  const T=S.t,body=$('#t-body');
  let rows=rowsFromResults();
  const classes=[...new Set(rows.map(r=>r.cls).filter(Boolean))].sort();
  const all=rows;
  if(T.cls)rows=rows.filter(r=>r.cls===T.cls);
  if(T.q)rows=rows.filter(r=>r.name.toLowerCase().includes(T.q.toLowerCase()));
  const students=new Set(all.map(r=>r.uid)).size;
  const avg=all.length?Math.round(all.reduce((s,r)=>s+r.a.pct,0)/all.length):0;
  const hi=all.length?Math.max(...all.map(r=>r.a.pct)):0,lo=all.length?Math.min(...all.map(r=>r.a.pct)):0;
  let h=`<div class="row" style="margin-bottom:10px"><button class="btn ghost sm" id="g-ref">Refresh grades</button></div><div class="stats">
    <div class="stat"><b>${students}</b><span>Students</span></div>
    <div class="stat"><b>${all.length}</b><span>Attempts</span></div>
    <div class="stat"><b>${all.length?avg+'%':'-'}</b><span>Average score</span></div>
    <div class="stat"><b>${all.length?hi+'% / '+lo+'%':'-'}</b><span>Highest / lowest</span></div></div>`;
  if(!S.resultsLoaded)h+=`<div class="sheet"><div class="empty"><b>Loading grades</b>One moment...</div></div>`;
  else if(!all.length){
    h+=`<div class="sheet"><div class="empty"><b>No results yet</b>Send the site link to your students. Their grades will appear here.</div></div>`;
  }else{
    h+=`<section class="sheet"><div class="row" style="margin-bottom:12px">
      <label class="f" style="flex:1;min-width:150px">Search by name<input class="in" id="g-q" value="${esc(T.q)}" placeholder="Student name"></label>
      <label class="f" style="min-width:140px">Class<select class="in" id="g-cls"><option value="">All classes</option>${classes.map(c=>`<option value="${esc(c)}" ${T.cls===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
      <button class="btn ghost sm" id="g-csv" style="align-self:flex-end">Export CSV</button></div>
      <div class="scroller"><table><thead><tr><th>Student</th><th>Class</th><th>Date</th><th>Vocabulary</th><th>Grammar</th><th>Score</th><th></th></tr></thead><tbody>`;
    rows.forEach((r,i)=>{
      const k=r.id,a=r.a,open=T.open===k;
      const c=a.v[0]+a.g[0],n=a.v[1]+a.g[1];
      h+=`<tr class="clk" data-k="${esc(k)}"><td>${esc(r.name)}</td><td>${esc(r.cls)||'-'}</td><td class="num">${nowStr(a.t)}</td>
        <td class="num">${a.v[0]}/${a.v[1]}</td><td class="num">${a.g[0]}/${a.g[1]}</td>
        <td class="num"><span class="pct ${a.pct>=75?'hi':a.pct<50?'lo':''}">${c}/${n} · ${a.pct}%</span></td>
        <td class="num" style="white-space:nowrap">${T.delAsk===r.id?`<button class="btn red sm" data-del="${esc(r.id)}">Delete</button> <button class="btn ghost sm" data-delno="1">Cancel</button>`:`<button class="btn ghost sm" data-delask="${esc(r.id)}" aria-label="Delete grade of ${esc(r.name)}">Delete</button>`}</td></tr>`;
      if(open){
        h+=`<tr><td colspan="7" style="background:var(--field)"><div class="hint" style="margin-bottom:8px">Form <span dir="ltr" class="mono">${esc(a.code)}</span> · Level ${LV[a.lv]||''} · Time ${mmss(a.dur||0)}</div>`;
        if(a.items){
          h+=a.items.map(it=>{const ok=it[3]===it[4];
            return `<div class="rv"><span class="mark ${ok?'y':'n'}">${ok?'✓':'✗'}</span><span class="en" dir="ltr">${esc(it[2]).replace(/___/g,'_____')}</span>
            <div class="hint">${ok?'':`Student answer: <span class="en" dir="ltr">${esc(it[4]||'no answer')}</span> · `}Correct: <span class="en" dir="ltr">${esc(it[3])}</span></div></div>`;}).join('');
        }else h+=`<div class="hint">Question details are kept only for each student’s last 5 attempts.</div>`;
        h+=`</td></tr>`;
      }
    });
    h+=`</tbody></table></div>`;
    if(!rows.length)h+=`<div class="empty">No matching results.</div>`;
    h+=`</section>`;
    // weak topics
    const agg={};
    all.forEach(r=>Object.entries(r.a.tp||{}).forEach(([t,v])=>{const x=agg[t]||(agg[t]=[0,0]);x[0]+=v[0];x[1]+=v[1];}));
    const list=Object.entries(agg).filter(e=>e[1][1]>0).map(([t,v])=>({t,p:Math.round(100*v[0]/v[1]),n:v[1]})).sort((a,b)=>a.p-b.p);
    if(list.length){
      h+=`<section class="sheet"><h2>Where did students make the most mistakes?</h2><p class="lead">Percentage of correct answers per topic, from weakest to strongest.</p><div class="bars">
      ${list.map(x=>`<div class="brow"><span>${esc(topicName(x.t))}</span><div class="track"><i class="${x.p<60?'w':''}" style="width:${x.p}%"></i></div><span class="mono" dir="ltr">${x.p}%</span></div>`).join('')}</div></section>`;
    }
  }
  body.innerHTML=h;
  const q=$('#g-q');if(q)q.oninput=()=>{T.q=q.value;const p=q.selectionStart;tGrades();const n=$('#g-q');n.focus();n.setSelectionRange(p,p);};
  const c=$('#g-cls');if(c)c.onchange=()=>{T.cls=c.value;tGrades();};
  body.querySelectorAll('tr.clk').forEach(tr=>tr.onclick=()=>{T.open=T.open===tr.dataset.k?null:tr.dataset.k;T.delAsk=null;tGrades();});
  body.querySelectorAll('[data-delask]').forEach(b=>b.onclick=e=>{e.stopPropagation();T.delAsk=b.dataset.delask;tGrades();});
  body.querySelectorAll('[data-delno]').forEach(b=>b.onclick=e=>{e.stopPropagation();T.delAsk=null;tGrades();});
  body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{e.stopPropagation();
    try{await tcall('removeResult',{id:b.dataset.del});T.delAsk=null;T.open=null;await loadResults();tGrades();}
    catch(e){if(!S.canEdit){render();return;}S.dbErr='Could not delete the result.';renderTeacher();}
  });
  const csv=$('#g-csv');if(csv)csv.onclick=exportCsv;
  const gr=$('#g-ref');if(gr)gr.onclick=async()=>{gr.disabled=true;await loadResults();if(S.canEdit)tGrades();else render();};
}
function exportCsv(){
  const rows=rowsFromResults();
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  let t='﻿'+['Name','Class','Date','Form','Vocabulary','Grammar','Total','Out of','Percent %'].map(q).join(',')+'\n';
  rows.forEach(r=>{const a=r.a;t+=[r.name,r.cls,nowStr(a.t),a.code,a.v[0]+'/'+a.v[1],a.g[0]+'/'+a.g[1],a.v[0]+a.g[0],a.v[1]+a.g[1],a.pct].map(q).join(',')+'\n';});
  const u=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=u;a.download='english-exam-results.csv';document.body.appendChild(a);a.click();a.remove();

function readCfg(){
  const n=(id,lo,hi)=>Math.max(lo,Math.min(hi,parseInt($(id).value,10)||0));

  return {title:($('#s-title').value.trim()||DEFAULT_CFG.title),vocabCount:n('#s-vc',0,40),grammarCount:n('#s-gc',0,40),
    level:+$('#s-lv').value,timeMin:n('#s-time',0,180),examMode:S.cfg.examMode==='fixed'?'fixed':'auto',ownMode:$('#s-own').value,ownCount:n('#s-oc',0,100),vocabSource:$('#s-src').value,showAnswers:$('#s-show').value==='1',
    topics:topics.length?topics:TOPICS.map(t=>t.id),compOn:!!S.cfg.compOn,compOpen:!!S.cfg.compOpen,compRound:S.cfg.compRound||1,compMin:S.cfg.compMin||[8,9,10]};
}
async function saveCfg(){
  const c=readCfg();
  if(c.vocabCount+c.grammarCount<1&&c.ownMode!=='only'){S.t.msg='Could not save: choose at least one question.';renderTeacher();return;}
  if(c.ownMode==='only'&&!S.own.length){S.t.msg='Could not save: you have not added any question in the “My questions” tab yet.';renderTeacher();return;}
  S.cfg=Object.assign({},DEFAULT_CFG,c);
  try{await tcall('save',{field:'cfg',value:c});S.t.msg='Settings saved. Students will see them when they open a new exam.';}
  catch(e){S.t.msg='Could not save the settings. Please try again.';}
  renderTeacher();
}

/* ---- rounds (prepare all three, then start) ---- */
async function loadRounds(){
  S.rexam=S.rexam||{};S.quals=S.quals||{};
  await Promise.all([1,2,3].map(async i=>{const r=await tcall('getPrivate',{field:'exam'+i});S.rexam[i]=r.value||null;}));
  await Promise.all([1,2].map(async i=>{if(!S.quals['qual'+i])await loadQual('qual'+i);}));
}
function packQ(q){return {sec:q.sec,topic:q.topic,type:q.type||'grammar',q:q.q,o:q.o,a:q.a,qd:q.qd,od:q.od,tip:q.tip||'',img:q.img||''};}
function roundQs(i,mode){
  if(mode==='own'){
    const R=makeRng((Math.random()*4294967295)>>>0);
    const all=S.own.filter(x=>x&&x.q&&x.c&&Array.isArray(x.w)&&x.w.length>=1&&(x.r||0)===i).map(x=>ownQ(R,x));
    return [...all.filter(q=>q.sec==='v'),...all.filter(q=>q.sec==='g')].map(packQ);
  }
  return buildExam(S.cfg,S.custom,S.own).questions.map(packQ);
}
async function saveRoundExam(i,mode){
  const T=S.t;
  const qs=roundQs(i,mode);
  if(!qs.length){T.rMsg='Could not prepare '+ROUND_NAMES[i]+': there are no questions to use.';tRounds();return;}
  const doc={code:('R'+i+Math.random().toString(36).slice(2,5)).toUpperCase(),at:Date.now(),src:mode,questions:qs};
  try{await tcall('save',{field:'exam'+i,value:doc});S.rexam[i]=doc;T.rMsg=`${ROUND_NAMES[i]} is ready with ${qs.length} question${qs.length===1?'':'s'}.`;}
  catch(e){if(!S.canEdit){render();return;}T.rMsg='Could not save the '+ROUND_NAMES[i]+' exam. Please try again.';}
  tRounds();
}
async function setComp(patch,okMsg){

  try{await tcall('save',{field:'cfg',value:nc});S.cfg=sanitizeCfg(nc);T.rankRound=null;T.rankMsg='';T.rMsg=okMsg;}

/* ---- competition + qualifiers ---- */
const normName=s=>String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
function corr(r){return r.a.v[0]+r.a.g[0];}
function rankCmp(x,y){return (corr(y)-corr(x))||(y.a.pct-x.a.pct)||((x.a.dur||0)-(y.a.dur||0))||(x.a.t-y.a.t);}
function bestByStudent(rr){
  const m=new Map(),cnt=new Map();
  S.results.filter(r=>rr===0||r.a.round===rr).forEach(r=>{const k=normName(r.name);cnt.set(k,(cnt.get(k)||0)+1);const cur=m.get(k);if(!cur||rankCmp(r,cur)<0)m.set(k,r);});
  return [...m.entries()].map(([k,r])=>({k,r,tries:cnt.get(k)})).sort((x,y)=>rankCmp(x.r,y.r)).map((x,i)=>Object.assign(x,{rank:i+1}));
}
async function loadQual(field){
  S.quals=S.quals||{};
  try{const q=await tcall('getPrivate',{field});S.quals[field]=new Set(Array.isArray(q.value)?q.value:[]);}
  catch(e){if(!S.canEdit)return false;S.quals[field]=new Set();}
  return true;
}
function examQCount(){return S.cfg.examMode==='fixed'&&fixedOk(S.fixed)?S.fixed.questions.length:examSize(S.cfg,S.own);}

    const u=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));

  :`<div class="empty"><b>No words added</b>When you choose “Lesson words” in the settings, questions will be made from these words.</div>`}
  </section>`;
  $('#w-add').onclick=addWords;
  body.querySelectorAll('[data-wd]').forEach(b=>b.onclick=async()=>{

  });

async function addWords(){
  const lines=$('#w-in').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const add=[];let bad=0;
  lines.forEach(l=>{
    const parts=l.split('|');const pair=parts[0].split(/\s*=\s*|\t/);
    const e=(pair[0]||'').trim(),a=(pair.slice(1).join(' ')||'').trim(),s=(parts[1]||'').trim();
    if(e&&a&&e.length<=40&&a.length<=120){add.push({e,a,s:s.includes('___')?s.slice(0,160):'',l:2});}else bad++;
  });
  if(!add.length){S.t.wordsMsg='Could not add words: write each line like: word = meaning';tWords();return;}
  const keep=S.custom.filter(w=>!add.some(x=>x.e.toLowerCase()===w.e.toLowerCase()));
  await saveWords([...keep,...add].slice(0,400),`Added ${add.length} word${add.length===1?'':'s'}${bad?` and skipped ${bad} invalid line${bad===1?'':'s'}`:''}.`);
}
async function saveWords(list,okMsg){
  try{await tcall('save',{field:'words',value:list});S.custom=list;S.t.wordsMsg=okMsg;}
  catch(e){S.t.wordsMsg='Could not save the words. Please try again.';}
  tWords();
}


/* ---- question images (Convex storage) ---- */
async function prepImage(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('img'));i.src=url;});
    const k=Math.min(1,1000/Math.max(im.naturalWidth,im.naturalHeight));
    const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.naturalWidth*k));c.height=Math.max(1,Math.round(im.naturalHeight*k));
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.82));
    if(!blob)throw new Error('blob');
    return blob;
  }finally{URL.revokeObjectURL(url);}
}
async function uploadImage(file){
  const blob=await prepImage(file);
  const r=await tcall('uploadUrl');
  const up=await fetch(r.url,{method:'POST',headers:{'Content-Type':'image/jpeg'},body:blob});
  const j=await up.json().catch(()=>null);
  if(!up.ok||!j||!j.storageId)throw new Error('upload');
  return {img:j.storageId,imgUrl:URL.createObjectURL(blob)};
}
function imgCtl(p,cur){
  const has=cur&&cur.img;
  return `<div class="f imgctl" id="${p}-ic">Question image <span class="hint">Optional, shown to the student under the question text</span>
    <div class="imgprev" id="${p}-prev" ${has&&cur.imgUrl?'':'hidden'}>${has&&cur.imgUrl?`<img src="${esc(cur.imgUrl)}" alt="">`:''}</div>
    <div class="row"><label class="btn ghost sm" style="cursor:pointer">${has?'Change image':'Add image'}<input type="file" id="${p}-file" accept="image/*" hidden></label>
    <button type="button" class="btn ghost sm" id="${p}-rm" ${has?'':'hidden'}>Remove image</button><span class="hint" id="${p}-st" aria-live="polite"></span></div></div>`;
}
function wireImg(p,get,set){
  const f=$('#'+p+'-file');if(!f)return;
  const st=$('#'+p+'-st'),prev=$('#'+p+'-prev'),rm=$('#'+p+'-rm');
  const paint=()=>{const c=get();prev.hidden=!(c&&c.img&&c.imgUrl);prev.innerHTML=c&&c.img&&c.imgUrl?`<img src="${esc(c.imgUrl)}" alt="">`:'';rm.hidden=!(c&&c.img);};
  f.onchange=async()=>{
    const file=f.files&&f.files[0];if(!file)return;
    if(!BACKEND_ON){st.textContent='Connect the site to Convex to upload images.';return;}
    st.textContent='Uploading image...';
    try{set(await uploadImage(file));st.textContent='Image uploaded.';paint();}
    catch(e){st.textContent=S.canEdit?'Could not upload the image. Make sure the file is an image and try again.':'';if(!S.canEdit)render();}
    f.value='';
  };
  rm.onclick=()=>{set({img:'',imgUrl:''});st.textContent='';paint();};
}

  const ld=$('#pv-load');if(ld)ld.onclick=()=>{T.prev=Object.assign({},fixedExam(S.cfg,S.fixed),{code:S.fixed.code});T.dirty=false;T.edit2=null;T.askNew=false;T.pvMsg='';tPreview();window.scrollTo(0,0);};
  const uf=$('#pv-unfix');if(uf)uf.onclick=unapproveExam;
  $('#pv-copy').onclick=()=>{
    let t=S.cfg.title+'  (Form '+E.code+')\n\n';
    Q.forEach((q,i)=>{t+=(i+1)+'. '+q.q.replace(/___/g,'_____')+'\n'+q.o.map((o,j)=>'   '+'abcd'[j]+') '+o).join('\n')+'\n';if(T.showKey!==false)t+='   ✓ '+q.o[q.a]+'\n';t+='\n';});
    copyText(t,$('#pv-copied'));
  };
  body.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>{const q=Q[+b.dataset.pe];T.pvImg={img:q.img||'',imgUrl:q.imgUrl||''};T.edit2=+b.dataset.pe;re();});
  body.querySelectorAll('[data-pd]').forEach(b=>b.onclick=()=>{Q.splice(+b.dataset.pd,1);T.dirty=true;T.edit2=null;re();});
  body.querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.pr,old=Q[i];let nq=null;
    if(old.type==='own'||old.type==='manual'){
      const R=makeRng((Math.random()*4294967295)>>>0);const used=avoid();
      const cand=S.own.filter(x=>x&&(x.s==='v'?'v':'g')===old.sec&&!used.has(x.q)&&x.w&&x.w.length);
      if(cand.length)nq=ownQ(R,R.pick(cand));
    }
    if(!nq)nq=genQuestion(S.cfg,S.custom,old.sec,old.type==='grammar'?old.topic:null,avoid())||genQuestion(S.cfg,S.custom,old.sec,null,avoid());
    if(nq){Q[i]=nq;T.dirty=true;T.pvMsg='';}else T.pvMsg='Could not find a replacement question.';
    re();
  });
  body.querySelectorAll('[data-pa]').forEach(b=>b.onclick=()=>{
    const sec=b.dataset.pa;const nq=genQuestion(S.cfg,S.custom,sec,null,avoid());
    if(nq){Q.splice(pvInsertPos(Q,sec),0,nq);T.dirty=true;T.pvMsg='';}else T.pvMsg='Could not generate a new question.';re();
  });
  body.querySelectorAll('[data-pn]').forEach(b=>b.onclick=()=>{T.pvImg={img:'',imgUrl:''};T.edit2='new-'+b.dataset.pn;re();});
  wireImg('e',()=>T.pvImg,v=>{T.pvImg=v;});
  const sv=$('#e-save');if(sv)sv.onclick=()=>{
    const err=$('#e-err');const q=$('#e-q').value.trim();
    const raw=[0,1,2,3].map(j=>$('#e-o'+j).value.trim());
    const chk=document.querySelector('input[name=e-c]:checked');const ci=chk?+chk.value:-1;
    const opts=[];let a=-1;
    raw.forEach((x,j)=>{if(x){if(j===ci)a=opts.length;opts.push(x);}});
    const uniq=new Set(opts.map(x=>x.toLowerCase())).size===opts.length;
    const fail=m=>{err.textContent=m;err.hidden=false;};
    if(!q)return fail('Write the question text.');
    if(opts.length<2)return fail('Write at least two options.');
    if(!uniq)return fail('The options must be different.');
    if(a<0)return fail('Select the correct answer with the circles, and its option must not be empty.');
    const sec=sv.dataset.sec;const tip=$('#e-tip').value.trim();
    const cur=typeof T.edit2==='number'?Q[T.edit2]:null;
    const nq={sec,topic:cur?cur.topic:'own-'+sec,type:cur?cur.type:'manual',q,o:opts,a,qd:hasAr(q)?'rtl':'ltr',od:opts.some(hasAr)?'rtl':'ltr',tip,img:(T.pvImg&&T.pvImg.img)||'',imgUrl:(T.pvImg&&T.pvImg.imgUrl)||''};
    if(cur)Q[T.edit2]=nq;else Q.splice(pvInsertPos(Q,sec),0,nq);
    T.edit2=null;T.dirty=true;T.pvMsg='';re();
  };
  const ca=$('#e-cancel');if(ca)ca.onclick=()=>{T.edit2=null;re();};
}
async function approveExam(){
  const T=S.t,E=T.prev;
  if(!E.questions.length){T.pvMsg='Could not approve: the exam has no questions.';tPreview();return;}
  const qs=E.questions.map(q=>({sec:q.sec,topic:q.topic,type:q.type||'grammar',q:q.q,o:q.o,a:q.a,qd:q.qd,od:q.od,tip:q.tip||'',img:q.img||''}));
  const code=T.dirty?E.code+'E':E.code;
  const doc={code,at:Date.now(),questions:qs};
  try{
    await tcall('save',{field:'fixed',value:doc});
    const c=Object.assign({},S.cfg,{examMode:'fixed'});
    await tcall('save',{field:'cfg',value:c});
    S.fixed=Object.assign({},doc,{questions:doc.questions.map((x,i)=>Object.assign({},x,{imgUrl:E.questions[i].imgUrl||''}))});S.cfg=sanitizeCfg(c);T.dirty=false;T.askNew=false;T.edit2=null;
    T.pvMsg='Exam approved. Every student who starts now takes these same questions.';
  }catch(e){T.pvMsg='Could not approve the exam. Please try again.';}
  tPreview();
}
async function unapproveExam(){
  const T=S.t;
  try{const c=Object.assign({},S.cfg,{examMode:'auto'});await tcall('save',{field:'cfg',value:c});S.cfg=sanitizeCfg(c);T.pvMsg='The exam changes for each student again.';}
  catch(e){T.pvMsg='Could not switch back to the changing exam. Please try again.';}
  tPreview();
}

/* ---- teacher's own questions ---- */
function tOwn(){
  const T=S.t,body=$('#t-body');const e=T.edit!=null?S.own[T.edit]:null;
  if(T.oImgFor!==T.edit){T.oImgFor=T.edit;T.oImg=e?{img:e.img||'',imgUrl:e.imgUrl||''}:{img:'',imgUrl:''};}
  const w=(e&&e.w)||[];
  body.innerHTML=`<section class="sheet"><h2>${e?'Edit question':'Add your own question'}</h2>
  <p class="lead">Write the question, the correct answer and some wrong options. The site shuffles the options for every student. For a blank inside the sentence type <span class="en">___</span>.</p>
  <div class="grid2">
    <label class="f">Type<select class="in" id="o-sec"><option value="g" ${e&&e.s==='g'||!e?'selected':''}>Grammar</option><option value="v" ${e&&e.s==='v'?'selected':''}>Vocabulary</option></select></label>
    <span></span>
    <label class="f" style="grid-column:1/-1">Question text<textarea class="in" id="o-q" maxlength="300" style="min-height:70px" placeholder="She ___ to school every day.">${esc(e?e.q:'')}</textarea></label>
    <label class="f">Correct answer<input class="in" id="o-c" maxlength="120" value="${esc(e?e.c:'')}"></label>
    <label class="f">Wrong option 1<input class="in" id="o-w0" maxlength="120" value="${esc(w[0]||'')}"></label>
    <label class="f">Wrong option 2 <span class="hint">Optional</span><input class="in" id="o-w1" maxlength="120" value="${esc(w[1]||'')}"></label>
    <label class="f">Wrong option 3 <span class="hint">Optional</span><input class="in" id="o-w2" maxlength="120" value="${esc(w[2]||'')}"></label>
    <label class="f" style="grid-column:1/-1">Note shown to the student if they answer wrongly <span class="hint">Optional</span><input class="in" id="o-tip" maxlength="200" value="${esc(e?e.tip||'':'')}"></label>
    <label class="f">Use in competition round <span class="hint">optional</span><select class="in" id="o-round">${[0,1,2,3].map(i=>`<option value="${i}" ${(e&&e.r||0)===i?'selected':''}>${i?ROUND_NAMES[i]:'Not for a specific round'}</option>`).join('')}</select></label>
    <div style="grid-column:1/-1">${imgCtl('o',T.oImg)}</div>
  </div>
  <div class="sp"></div>
  ${T.ownMsg?`<div class="note ${T.ownMsg.startsWith('Could not')?'bad':'ok'}">${esc(T.ownMsg)}</div><div class="sp"></div>`:''}
  <div class="row"><button class="btn" id="o-save">${e?'Save changes':'Add question'}</button>${e?'<button class="btn ghost" id="o-cancel">Cancel</button>':''}</div>
  </section>
  ${e?'':`<section class="sheet"><h2>Add several questions at once</h2>
  <p class="lead">Write each question on its own line and separate its parts with the <span class="en">|</span> sign in this order: question | correct answer | wrong | wrong | wrong. Start the line with <span class="en">v:</span> for vocabulary or <span class="en">g:</span> for grammar (grammar is the default).</p>
  <textarea class="in en" id="o-bulk" dir="ltr" placeholder="g: My brother ___ football every Friday. | plays | play | playing | played&#10;v: What does “borrow” mean? | to take something and give it back later | to carry | to visit | to forget"></textarea>
  <div class="sp"></div><div class="row" style="align-items:flex-end"><label class="f" style="min-width:220px">Use these in competition round<select class="in" id="o-bulk-round">${[0,1,2,3].map(i=>`<option value="${i}">${i?ROUND_NAMES[i]:'Not for a specific round'}</option>`).join('')}</select></label><button class="btn" id="o-bulk-go">Add questions</button></div></section>`}
  ${pubSection()}
  <section class="sheet"><h2>My questions (${S.own.length})</h2>
  ${S.own.length?S.own.map((x,i)=>{const ar=/[؀-ۿ]/.test(x.q);return `<div class="rv"><div class="row" style="justify-content:space-between;align-items:flex-start;flex-wrap:nowrap">
    <div style="min-width:0;flex:1"><span class="pill" style="font-size:.78rem">${x.s==='v'?'Vocabulary':'Grammar'}</span>${x.img?' <span class="pill" style="font-size:.78rem">with image</span>':''}${x.r?` <span class="pill" style="font-size:.78rem">${ROUND_NAMES[x.r]}</span>`:''}
    <div class="${ar?'':'en'}" dir="${ar?'rtl':'ltr'}" style="margin-top:6px;overflow-wrap:anywhere">${esc(x.q).replace(/___/g,'_____')}</div>
    <div class="hint" style="margin-top:4px"><span class="mark y">✓</span><span class="en" dir="ltr">${esc(x.c)}</span> &nbsp; ${x.w.map(t=>`<span class="mark n">✗</span><span class="en" dir="ltr">${esc(t)}</span>`).join(' &nbsp; ')}</div></div>
    <div class="row" style="flex:none"><button class="btn ghost sm" data-oe="${i}">Edit</button><button class="btn ghost sm" data-od="${i}">Delete</button></div></div></div>`;}).join('')
  :`<div class="empty"><b>No questions added yet</b>Add your first question using the form above, then turn on “Teacher questions” in the Exam settings tab.</div>`}
  </section>`;
  wireImg('o',()=>T.oImg,v=>{T.oImg=v;});
  const pb=$('#o-pub');if(pb)pb.onclick=publishOwn;
  const ub=$('#o-unpub');if(ub)ub.onclick=unpublishOwn;
  $('#o-save').onclick=saveOneOwn;
  const bg=$('#o-bulk-go');if(bg)bg.onclick=saveBulkOwn;
  const cn=$('#o-cancel');if(cn)cn.onclick=()=>{T.edit=null;T.oImgFor=undefined;T.ownMsg='';tOwn();};
  body.querySelectorAll('[data-oe]').forEach(b=>b.onclick=()=>{T.edit=+b.dataset.oe;T.ownMsg='';tOwn();window.scrollTo(0,0);});
  body.querySelectorAll('[data-od]').forEach(b=>b.onclick=async()=>{
    const i=+b.dataset.od;T.edit=null;await saveOwn(S.own.filter((_,k)=>k!==i),'Question deleted.');
  });
}
function pubSection(){
  const T=S.t,n=S.own.length,fixedOn=S.cfg.examMode==='fixed'&&fixedOk(S.fixed);
  return `<section class="sheet"><h2>Publish my questions as the student exam</h2>
  <p class="lead">Use all <b>${n}</b> question${n===1?'':'s'} below as the exam. Students will get exactly these questions, with vocabulary first and then grammar. The options of each question are shuffled once. If you change a question later, approve again to update the exam.</p>
  ${fixedOn?`<div class="note ok">Students are now taking a fixed exam (form <b dir="ltr">${esc(S.fixed.code)}</b>, ${S.fixed.questions.length} questions).</div><div class="sp"></div>`:''}
  ${T.pubMsg?`<div class="note ${T.pubMsg.startsWith('Could not')?'bad':'ok'}">${esc(T.pubMsg)}</div><div class="sp"></div>`:''}
  <div class="row"><button class="btn red" id="o-pub" ${n?'':'disabled'}>Approve my ${n} question${n===1?'':'s'} for students</button>
  ${fixedOn?'<button class="btn ghost" id="o-unpub">Go back to the changing exam</button>':''}</div></section>`;
}
async function publishOwn(){
  const T=S.t;
  const R=makeRng((Math.random()*4294967295)>>>0);
  const valid=S.own.filter(x=>x&&x.q&&x.c&&Array.isArray(x.w)&&x.w.length>=1);
  if(!valid.length){T.pubMsg='Could not approve: add at least one question first.';tOwn();return;}
  const all=valid.map(x=>ownQ(R,x));
  const qs=[...all.filter(q=>q.sec==='v'),...all.filter(q=>q.sec==='g')].map(q=>({sec:q.sec,topic:q.topic,type:'own',q:q.q,o:q.o,a:q.a,qd:q.qd,od:q.od,tip:q.tip||'',img:q.img||''}));
  const doc={code:('T'+Math.random().toString(36).slice(2,6)).toUpperCase(),at:Date.now(),questions:qs};
  try{
    await tcall('save',{field:'fixed',value:doc});
    const c=Object.assign({},S.cfg,{examMode:'fixed'});
    await tcall('save',{field:'cfg',value:c});
    S.cfg=sanitizeCfg(c);S.fixed=Object.assign({},doc,{questions:doc.questions.map((x,i)=>Object.assign({},x,{imgUrl:(all.find(z=>z.q===x.q)||{}).imgUrl||''}))});
    T.pubMsg=`Exam approved with ${qs.length} question${qs.length===1?'':'s'}. Every student who starts now takes these questions.`;
  }catch(e){if(!S.canEdit){render();return;}T.pubMsg='Could not approve the exam. Please try again.';}
  tOwn();
}
async function unpublishOwn(){
  const T=S.t;
  try{const c=Object.assign({},S.cfg,{examMode:'auto'});await tcall('save',{field:'cfg',value:c});S.cfg=sanitizeCfg(c);T.pubMsg='The exam changes for each student again.';}
  catch(e){if(!S.canEdit){render();return;}T.pubMsg='Could not switch back. Please try again.';}
  tOwn();
}
function cleanQ(s,q,c,ws,tip,im,r){
  q=String(q).trim();c=String(c).trim();ws=ws.map(x=>String(x).trim()).filter(Boolean);
  if(!q||!c||!ws.length)return null;
  const seen=new Set([c.toLowerCase()]);const w=[];
  ws.forEach(x=>{const k=x.toLowerCase();if(!seen.has(k)){seen.add(k);w.push(x.slice(0,120));}});
  if(!w.length)return null;
  return {s:s==='v'?'v':'g',q:q.slice(0,300),c:c.slice(0,120),w:w.slice(0,3),tip:String(tip||'').trim().slice(0,200),img:(im&&im.img)||'',imgUrl:(im&&im.imgUrl)||'',r:[1,2,3].includes(+r)?+r:0};
}
async function saveOneOwn(){
  const T=S.t;
  const x=cleanQ($('#o-sec').value,$('#o-q').value,$('#o-c').value,[$('#o-w0').value,$('#o-w1').value,$('#o-w2').value],$('#o-tip').value,T.oImg,$('#o-round').value);
  if(!x){T.ownMsg='Could not save: write the question, the correct answer and at least one wrong option (different from the correct one).';tOwn();return;}
  const list=S.own.slice();
  if(T.edit!=null){list[T.edit]=x;}else list.push(x);
  const wasEdit=T.edit!=null;T.edit=null;T.oImgFor=undefined;
  await saveOwn(list.slice(0,300),wasEdit?'Changes saved.':'Question added. You can add another one.');
}
async function saveBulkOwn(){
  const T=S.t;const lines=$('#o-bulk').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const add=[];let bad=0;
  lines.forEach(l=>{
    let s='g';const m=l.match(/^([vg])\s*:\s*/i);if(m){s=m[1].toLowerCase();l=l.slice(m[0].length);}
    const p=l.split('|');const x=cleanQ(s,p[0]||'',p[1]||'',p.slice(2),'',null,($('#o-bulk-round')||{}).value);
    if(x)add.push(x);else bad++;
  });
  if(!add.length){T.ownMsg='Could not add the questions: write each line like: question | correct answer | wrong | wrong';tOwn();return;}
  await saveOwn([...S.own,...add].slice(0,300),`Added ${add.length} question${add.length===1?'':'s'}${bad?` and skipped ${bad} invalid line${bad===1?'':'s'}`:''}.`);
}
async function saveOwn(list,okMsg){
  try{await tcall('save',{field:'questions',value:list.map(x=>{const r=Object.assign({},x);delete r.imgUrl;return r;})});S.own=list;S.t.ownMsg=okMsg;}
  catch(e){S.t.ownMsg='Could not save the questions. Please try again.';}
  tOwn();
}

/* ============ BOOT ============ */
function sanitizeCfg(d){
  const c=Object.assign({},DEFAULT_CFG,d||{});
  c.vocabCount=Math.max(0,Math.min(40,+c.vocabCount||0));c.grammarCount=Math.max(0,Math.min(40,+c.grammarCount||0));
  if(c.vocabCount+c.grammarCount<1&&c.ownMode!=='only')c.vocabCount=10;
  c.examMode=c.examMode==='fixed'?'fixed':'auto';
  c.ownMode=['off','mix','only'].includes(c.ownMode)?c.ownMode:'off';c.ownCount=Math.max(0,Math.min(100,+c.ownCount||0));
  c.level=[0,1,2,3].includes(+c.level)?+c.level:2;c.timeMin=Math.max(0,Math.min(180,+c.timeMin||0));
  c.topics=Array.isArray(c.topics)&&c.topics.length?c.topics:TOPICS.map(t=>t.id);
  c.compOn=!!c.compOn;c.compOpen=c.compOpen===true;c.compRound=Math.max(1,Math.min(3,Math.round(+c.compRound||1)));
  c.compMin=[0,1,2].map(i=>Math.max(0,Math.min(200,Math.round(+((Array.isArray(c.compMin)?c.compMin:[8,9,10])[i])||[8,9,10][i]))));
  c.title=String(c.title||DEFAULT_CFG.title).slice(0,80);c.showAnswers=c.showAnswers!==false;
  return c;
}
async function loadResults(){
  if(!S.canEdit)return;
  try{
    const res=await tcall('listResults');
    S.results=res.rows.map(r=>({id:r.id,uid:String(r.name).trim().toLowerCase()+'|'+String(r.cls||'').trim().toLowerCase(),name:r.name,cls:r.cls||'',
      a:{t:r.t,code:r.code,v:r.v,g:r.g,pct:r.pct,dur:r.dur,lv:r.lv,round:r.round||0,tp:r.tp||{},items:Array.isArray(r.items)?r.items:null}}));
    S.resultsLoaded=true;S.dbErr='';
  }catch(e){
    if(!S.canEdit)return;
    S.resultsLoaded=true;S.dbErr='Could not load the grades. Check your internet, then press “Refresh grades”.';
  }
}
function renderLogin(){
  $('#main').innerHTML=`<section class="sheet"><h2>Teacher sign-in</h2>
  <p class="lead">Type the secret code to open the grades and settings.</p>
  ${!BACKEND_ON?'<div class="note bad">The site is not connected to the database yet. Open the file config.js and put your Convex URL in it, as explained in the instructions file.</div><div class="sp"></div>':''}
  ${S.loginMsg?`<div class="note bad">${esc(S.loginMsg)}</div><div class="sp"></div>`:''}
  <label class="f" style="max-width:340px">Secret code<input class="in" id="l-code" type="password" autocomplete="current-password"></label>
  <div class="sp"></div><div class="row"><button class="btn" id="l-go">Sign in</button></div></section>`;
  $('#l-go').onclick=doLogin;
  $('#l-code').onkeydown=e=>{if(e.key==='Enter')doLogin();};
}
async function doLogin(){
  const code=$('#l-code').value;if(!code)return;
  $('#l-go').disabled=true;
  try{
    const r=await cx('mutation','exam:check',{code});
    if(r&&r.ok){
      S.code=code;S.canEdit=true;S.preview=true;S.loginMsg='';
      try{sessionStorage.setItem('ex-code',code);}catch(e){}
      await loadResults();render();return;
    }
    S.loginMsg=r&&r.reason==='locked'?'Too many wrong attempts. Wait 10 minutes and try again.':
      r&&r.reason==='not_configured'?'The secret code has not been set in Convex yet. See the instructions file.':'Incorrect secret code.';
  }catch(e){S.loginMsg='Could not reach the server. Check your internet and the Convex URL in config.js.';}
  render();
}
async function boot(){
  await refreshSettings();
  S.ready=true;
  let code='';try{code=sessionStorage.getItem('ex-code')||'';}catch(e){}
  if(code&&BACKEND_ON){
    try{
      const r=await cx('mutation','exam:check',{code});
      if(r&&r.ok){S.code=code;S.canEdit=true;S.preview=true;await loadResults();}
      else{try{sessionStorage.removeItem('ex-code');}catch(e){}}
    }catch(e){}
  }
  render();
  setInterval(()=>{
    if(S.canEdit&&S.view==='teacher'&&S.t.tab==='grades'&&!document.hidden&&!document.activeElement.matches('input,select,textarea'))
      loadResults().then(()=>{if(S.canEdit&&S.view==='teacher'&&S.t.tab==='grades')tGrades();});
  },30000);
}
route();
boot();
